<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoteBridge — Sign in</title>
<style>
  :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 20% 10%,#15315a 0,#07101f 42%,#050a13 100%);
    color:#eaf1ff;
  }
  .box{
    width:100%;max-width:380px;background:rgba(14,27,47,.9);border:1px solid #253b5a;
    border-radius:18px;padding:34px;box-shadow:0 20px 70px rgba(0,0,0,.3);
  }
  h1{margin:0 0 4px;font-size:22px}
  .sub{color:#9db0ca;font-size:13px;margin:0 0 24px}
  label{display:block;font-size:12.5px;font-weight:700;color:#bcd0ee;margin-bottom:6px}
  .field{margin-bottom:16px}
  input{
    width:100%;height:44px;padding:0 13px;border-radius:10px;border:1px solid #253b5a;
    background:#07101c;color:#eaf1ff;font-size:14px;outline:none;
  }
  input:focus{border-color:#3a6fbb;box-shadow:0 0 0 2px rgba(43,109,232,.18)}
  button{
    width:100%;height:44px;margin-top:8px;border:0;border-radius:10px;background:#2b6de8;
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:not-allowed}
  .error{
    display:none;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;
    background:#281b0d;border:1px solid #815827;color:#f2c58a;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>RemoteBridge</h1>
    <p class="sub">Sign in to continue</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn">Sign in</button>
      <div class="error" id="errorBox"></div>
    </form>
  </div>
  <script>
    // Derive the app base path the same way index.php does, so this file
    // works whether it's deployed at the site root or in a subfolder.
    const RB_BASE = location.pathname.replace(/\/login\.html$/, '');
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    // If already signed in, skip straight to the app.
    fetch(RB_BASE + '/api/auth/me', { cache: 'no-store' })
      .then(r => { if (r.ok) window.location.href = RB_BASE + '/index.php'; })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const res = await fetch(RB_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = RB_BASE + '/index.php';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
