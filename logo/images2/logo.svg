<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Bridge structure - left tower -->
  <rect x="40" y="60" width="8" height="80" fill="url(#grad1)" rx="4"/>
  
  <!-- Bridge structure - right tower -->
  <rect x="152" y="60" width="8" height="80" fill="url(#grad1)" rx="4"/>
  
  <!-- Bridge main span -->
  <path d="M 48 100 Q 100 70 160 100" stroke="url(#grad2)" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Bridge support cables -->
  <line x1="60" y1="70" x2="48" y2="100" stroke="url(#grad1)" stroke-width="2" opacity="0.8"/>
  <line x1="100" y1="50" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2" opacity="0.8"/>
  <line x1="140" y1="70" x2="160" y2="100" stroke="url(#grad1)" stroke-width="2" opacity="0.8"/>
  
  <!-- Connection nodes -->
  <circle cx="48" cy="100" r="5" fill="url(#grad2)"/>
  <circle cx="100" cy="100" r="5" fill="url(#grad2)"/>
  <circle cx="160" cy="100" r="5" fill="url(#grad2)"/>
  
  <!-- Top accent element (represents signal/remote) -->
  <g opacity="0.9">
    <path d="M 100 35 L 105 50 L 95 50 Z" fill="url(#grad2)"/>
    <circle cx="100" cy="40" r="8" fill="none" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
